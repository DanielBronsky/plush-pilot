<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7cc46a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Plush Pilot</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #7cc46a;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        touch-action: none;
        outline: none;
      }
      /* Невидимый элемент: через него читаем safe-area из CSS env(). */
      #safe-probe {
        position: fixed;
        inset: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #fff;
        transition: opacity 0.3s;
      }
      #boot .logo {
        font-size: min(44px, 11vw);
        font-weight: 800;
        letter-spacing: 1px;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
      }
      #boot .bar {
        width: 220px;
        height: 14px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.18);
        overflow: hidden;
      }
      #boot .fill {
        width: 0%;
        height: 100%;
        border-radius: 7px;
        background: #ffcf3f;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <div id="safe-probe"></div>
    <div id="boot">
      <div class="logo">Plush Pilot</div>
      <div class="bar"><div class="fill" id="boot-fill"></div></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
